 span{display:block;color:var(--muted);font-size:11px;margin-top:6px;font-weight:600}.mode .q{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:10px;background:#18271d;border:1px solid var(--line);font-weight:900}.mode.active{border-color:var(--green);box-shadow:0 0 0 1px rgba(104,196,135,.22) inset}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seg button{min-height:45px;background:var(--panel);border:1px solid var(--line);border-radius:14px;font-weight:850}.seg button.active{background:#173021;border-color:var(--green)}.seg.two{grid-template-columns:1fr 1fr}.players{display:grid;gap:8px}.playerRow{display:flex;align-items:center;gap:9px}.playerNo{width:30px;color:var(--muted);font-weight:900}.textInput,.numInput,.select{width:100%;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:#0b1510;color:var(--text);padding:0 12px;outline:none}.textInput:focus,.numInput:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(104,196,135,.10)}.primary{width:100%;min-height:54px;border-radius:18px;background:linear-gradient(135deg,#5fb97e,#78d395);color:#07100b;font-weight:950;font-size:16px;box-shadow:0 10px 25px rgba(104,196,135,.15)}.secondary{width:100%;min-height:48px;border-radius:16px;background:#142119;border:1px solid var(--line);font-weight:850}.hint{font-size:12px;color:var(--muted);line-height:1.4}.toolbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:7px;align-items:center}.title{font-weight:950;font-size:20px;letter-spacing:-.03em}.scorebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(670px,calc(100% - 18px));z-index:20;display:flex;gap:6px;padding:7px;border-radius:19px;background:rgba(10,18,13,.92);border:1px solid #314437;backdrop-filter:blur(16px);box-shadow:0 18px 40px rgba(0,0,0,.4)}.scorechip{flex:1;min-width:0;text-align:center;padding:7px 4px;border-radius:13px;background:#142018}.scorechip b{display:block;font-size:15px}.scorechip small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.card{background:rgba(13,23,17,.9);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.table{width:100%;border-collapse:separate;border-spacing:0}.table th,.table td{border-bottom:1px solid #1c2a20;border-right:1px solid #1c2a20;padding:6px 4px;text-align:center;font-size:12px}.table th:last-child,.table td:last-child{border-right:0}.table tr:last-child td{border-bottom:0}.table th{background:#132018;color:#dbe6dc;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.hole{width:36px;color:var(--muted);font-weight:900}.compact{width:100%;height:36px;border-radius:10px;background:#09110c;border:1px solid #26372b;color:var(--text);text-align:center;padding:0;font-weight:800}.sum{font-weight:950;font-size:14px}.sub{display:block;color:var(--muted);font-size:9px}.teamHead{background:#1a2b20!important;color:#bfe9ca!important}.badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 7px;border-radius:99px;background:#16261b;border:1px solid #2c4433;font-size:9px;color:#b8c7bb;font-weight:900}.resultBox{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:34px;border-radius:12px;font-weight:950;font-size:12px;border:1px solid #344238;background:#6f7871;color:#fff}.up{background:#286fb8;border-color:#5ea8ff}.down{background:#b33b43;border-color:#ff7a7e}.tied{background:#68706a;border-color:#919a93}.tiny{font-size:10px!important}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;background:#132219;border:1px solid var(--line);font-size:10px;font-weight:850}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);display:flex;align-items:flex-end;justify-content:center;padding:12px}.modalBox{width:min(680px,100%);max-height:88vh;overflow:auto;border:1px solid #33483a;background:#0c1610;border-radius:26px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .18s ease}.modalBox h2{margin:0 0 8px}.modalBox p{color:#b9c4bb;line-height:1.5;font-size:14px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.close{min-height:46px;border-radius:15px;background:#17241b;border:1px solid var(--line);font-weight:900}.danger{background:#4b2024;border-color:#7d343a}.hide{display:none!important}.animate{animation:pop .2s ease}@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}@keyframes pop{0%{transform:scale(.985);opacity:.6}100%{transform:none;opacity:1}}.circle{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;color:#000;font-weight:950;border:1px solid rgba(255,255,255,.55)}.par{background:#777}.oneunder{background:#e5bf38}.twounder{background:#4c86db}.sq{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;color:#000;font-weight:950;border:1px solid rgba(255,255,255,.65)}.oneover{background:#d84b52}.twoplus{background:#050505;color:#fff}.stablePts{font-size:9px;font-style:italic;vertical-align:super;margin-left:2px}.hcptxt{font-size:9px;font-style:italic;color:#9ba89d}.bonusBtn{width:28px;height:28px;border-radius:9px;background:#17271d;border:1px solid #2a4132;font-weight:950}.bonusList{display:grid;gap:6px;max-height:52vh;overflow:auto}.bonusItem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#101b14;border:1px solid #25372a;border-radius:13px}.bonusItem em{color:var(--muted);font-size:11px}.bonusItem button{min-width:44px;height:36px;border-radius:10px;background:#1a2c20;border:1px solid #304737;font-weight:950}.bonusItem.used{opacity:.45}.bonusItem.used .bonusName{text-decoration:line-through}.modeInfo{display:flex;align-items:center;gap:8px;margin-bottom:12px}.modeInfo .badge{font-size:11px}.miniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.settingsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.settingCard{padding:12px;border-radius:16px;background:#101b14;border:1px solid var(--line)}.settingCard label{font-size:10px;color:var(--muted);font-weight:900;display:block;margin-bottom:6px}.points{font-weight:950}.cross{text-decoration:line-through;opacity:.42}.smallBtn{min-height:38px;border-radius:12px;background:#142119;border:1px solid var(--line);font-size:12px;font-weight:900;padding:0 10px}.scrollX{overflow-x:auto}.wide{min-width:540px}.note{padding:10px 12px;border-radius:14px;background:#101b14;border:1px solid var(--line);color:#aebbb1;font-size:11px;line-height:1.4}.teamLabel{font-size:9px;color:#8fb89b;font-weight:900}.rankPts{font-weight:950}.footerSpace{height:15px}@media(max-width:390px){.modeGrid{grid-template-columns:1fr}.hero h1{font-size:30px}.table th,.table td{padding:5px 2px}.compact{height:34px}.app{padding-left:10px;padding-right:10px}.toolbar{grid-template-columns:auto 1fr auto}.toolbar .backText{display:none}.scorechip b{font-size:13px}}
.holeDone{display:block;margin:2px auto 0;width:20px;height:18px;border-radius:7px;background:#142119;border:1px solid #2a4031;color:#9fb3a3;font-size:9px;font-weight:950}.holeDone:active{transform:scale(.92)}</style></head><body><div id="app"></div><div id="modalRoot"></div><script>
'use strict';
const MODES=[
 ['count','Zählspiel','18 Loch · niedrigste Schlagzahl gewinnt'],['match','Matchplay','Loch für Loch · Einzel oder 2 gegen 2'],['short','Kurzspiel-Competition','PAR-basierte Farbwertung'],['fun','Fun','Zufall · Bonus/Malus · Punkte'],['wolf','Wolf','Wolf wechselt · Punkte pro Loch'],['531','5–3–1','3 Spieler · 5/3/1-System'],['stable','Stableford','PAR + Vorgabe · Stableford'],['vegas','Las Vegas','4 Spieler · 2 Teams'],['bbb','Bingo Bango Bongo','3 Punkte pro Loch möglich'],['skins','Skins','Skins wandern bei Gleichstand weiter'],['nassau','Nassau','Front 9 · Back 9 · Gesamt']
];
const FUNMODES=['Zufallsschläger (Luck of the draw)','Zufallsschläger für Alle (ganze Bahn)','Pflichtfairway/-grün','Scramble Worst Ball','Scramble Best Ball','Nimm 2 - Best Ball','Nimm 2 - Worst Ball','Von Rot','Nur Pitching Wedge','Nur Eisen 7','Nur Holz','Nur Driver','Nur Putter','Leder Wedge (Mitspieler, x-Mal, Grün rettet)','Leder Wedge - x-Mal','Leder Wedge - ein Mal','Nur 2 Schläger','Leder Wedge (Mitspieler, 1 Mal, Grün rettet)','No Iron','No Putter','Nur Eisen','Nur Wedges','Caddie-Modus (Mitspieler wählen Schläger)'];
const CLUBS=['Driver','Hybrid','Holz 3','Holz 5','Eisen 4','Eisen 5','Eisen 6','Eisen 7','Eisen 8','Eisen 9','Pitching Wedge','Gap Wedge','Sand Wedge','Lob Wedge','Putter'];
const BONUS=[['Hole Out',1],['Chip In',1],['1-Putt',1],['3-Putt',-1],['Bunker',-1],['Holz getroffen',-1],['Penalty Area',-1],['Lady',-1],['Schneckenficker',-1],['Adolf',-1],['Luftschlag',-1],['Fairway verfehlt',-1],['Green in regulation',1],['Gescramblet',1],['Nearest to the pin (PAR 3)',1],['Out of bounds',-1],['Birdie',1],['Eagle',2],['Falsches PAR',1],['Sandy PAR',1],['Socket',-1],["Über‘s Grün getoppt",-1],['Vom Grün geputtet',-1],['2 Chips',-1],['Doppel-PAR und mehr',-1],['Texas Wedge gelocht',1]];
const HOLES=[ [1,4,11],[2,4,7],[3,3,17],[4,5,9],[5,4,1],[6,3,15],[7,5,3],[8,4,13],[9,4,5],[10,4,10],[11,4,12],[12,3,14],[13,5,4],[14,4,2],[15,4,16],[16,5,6],[17,3,18],[18,4,8] ];
const MODEINFO={count:'Zählspiel: Für jedes Loch wird die Schlagzahl eingetragen. Unter Loch 18 steht der aktuelle Gesamtscore.',match:'Matchplay: 2 Einzelspieler oder 2 Teams. Gewonnen = 1 Up, verloren = 1 Down, geteilt = Tied. Die Gegenseite wird automatisch gesperrt.',short:'Kurzspiel-Competition: Ein PAR gilt für alle 18 Löcher. Die Farbe/Form zeigt die Abweichung vom PAR.',fun:'Fun: Pro Loch wird ein zufälliger Fun-Modus gezogen. Zusätzlich können pro Spieler Bonus-/Maluspunkte vergeben werden.',wolf:'Wolf: Der Wolf wechselt pro Loch. Der Wolf wählt Mitspieler oder Lone Wolf; danach wird die Punktwertung automatisch berechnet.',531:'5–3–1: Nur 3 Spieler. Bestes Ergebnis erhält 5, zweitbestes 3, schlechtestes 1. Bei Gleichständen greifen die festgelegten Sonderregeln.',stable:'Stableford: PAR/HCP des Golfclub Varus sind vorbelegt. Die Spielvorgabe wird lochweise verteilt.',vegas:'Las Vegas: 4 Spieler, Team A = Spieler 1+2, Team B = Spieler 3+4. Die kleinere Zahl steht zuerst; bei Birdie wird das gegnerische Team gedreht.',bbb:'Bingo Bango Bongo: Drei Auszeichnungen je Loch – erster auf dem Grün, nearest to the pin und erster im Loch. Jede gibt 1 Punkt.',skins:'Skins: Jeder Skin geht an den alleinigen Lochgewinner. Bei Gleichstand wird der Skin auf das nächste Loch übertragen.',nassau:'Nassau: Drei Wertungen – Front 9, Back 9 und Gesamt 18. Je nach Ergebnis gewinnt Spieler/Team die jeweilige Teilwertung.'};
let S=load();
function blankState(){return {screen:'home',mode:null,players:[],count:2,team:false,par:4,stableHcp:[0,0,0,0],holeDone:Array(18).fill(false),data:{},fun:{holeModes:Array(18).fill(null),unique:false,clubs:Array(18).fill(null),shotClubs:Array.from({length:18},()=>[]),bonus:Array.from({length:18},()=>Array.from({length:4},()=>[]))},settings:JSON.parse(localStorage.getItem('gd_course')||'null')||HOLES.map(x=>[...x]),timestamp:Date.now()};}
function load(){try{return Object.assign(blankState(),JSON.parse(localStorage.getItem('golfDeluxe')||'{}'))}catch(e){return blankState()}}
function save(){localStorage.setItem('golfDeluxe',JSON.stringify(S));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function playerName(i){return S.players[i]||`Spieler ${i+1}`}
function names(){return Array.from({length:S.count},(_,i)=>playerName(i))}
function isTeam(){return S.team&&S.count===4&&(S.mode==='count'||S.mode==='match'||S.mode==='fun')}
function teams(){return [['Team A',[0,1]],['Team B',[2,3]]]} 
function modeLabel(){return MODES.find(m=>m[0]===S.mode)?.[1]||''}
function setData(path,val){let o=S.data;for(let i=0;i<path.length-1;i++){if(o[path[i]]==null)o[path[i]]={};o=o[path[i]]}o[path[path.length-1]]=val;save()}
function getData(path,def=''){let o=S.data;for(const k of path){if(o==null)return def;o=o[k]}return o==null?def:o}
function render(){const app=document.getElementById('app'); if(S.screen==='home')app.innerHTML=home();else app.innerHTML=game(); updateScorebar();}
function home(){let allowed=S.mode;return `<div class="app"><div class="top"><div class="brand">Golf Deluxe<small>Dark Golf · 18 holes</small></div><button class="iconBtn" onclick="courseSettings()">⚙</button></div><div class="hero"><h1>Dein Golfspiel.</h1><p>18 Löcher. Klare Regeln. Ein bisschen Chaos. Alles auf deinem iPhone.</p></div><div class="section"><div class="label">Spielmodus</div><div class="modeGrid">${MODES.map(m=>`<button class="mode ${allowed===m[0]?'active':''}" onclick="selectMode('${m[0]}')">${m[1]}<span>${m[2]}</span><b class="q" onclick="event.stopPropagation();showInfo('${m[0]}')">?</b></button>`).join('')}</div></div>${configArea()}<div class="section"><button class="primary" onclick="startGame()">Spiel starten</button></div><div class="note">Der Spielstand wird automatisch auf diesem Gerät gespeichert. Reset und Rückkehr zur Startseite fragen vorher nach.</div><div class="footerSpace"></div></div>`}
function selectMode(m){S.mode=m;S.screen='home'; if(m==='531')S.count=3;if(m==='vegas')S.count=4;if(m==='wolf'&&S.count<3)S.count=3;if(m==='bbb'&&S.count<2)S.count=2;if(m==='match'&&![2,4].includes(S.count))S.count=2;if(m==='match'&&S.count===4)S.team=true;if(m==='match'&&S.count===2)S.team=false;if(m==='fun'&&S.count<2)S.count=2;save();render()}
function configArea(){if(!S.mode)return `<div class="section"><div class="note">Wähle zuerst einen Modus. Über „?“ siehst du eine kurze Regelerklärung.</div></div>`;let teamAllowed=['count','fun'].includes(S.mode)&&S.count===4;let countFixed=['531','vegas'].includes(S.mode);let extra='';if(S.mode==='short')extra=`<div class="section"><div class="label">PAR für alle 18 Löcher</div><input class="numInput" type="number" min="1" max="9" value="${S.par}" oninput="S.par=Math.max(1,Math.min(9,Number(this.value)||1));save();liveRefresh(this)"></div>`;if(S.mode==='fun')extra=`<div class="section"><div class="label">Fun-Generator</div><div class="seg two"><button class="${S.fun.unique?'active':''}" onclick="S.fun.unique=true;save();render()">Alle nur 1x</button><button class="${!S.fun.unique?'active':''}" onclick="S.fun.unique=false;save();render()">Wiederholungen erlaubt</button></div><div class="hint" style="margin-top:7px">Bei „Alle nur 1x“ werden 18 verschiedene Modi aus der Liste gezogen.</div></div>`;if(S.mode==='stable')extra=`<div class="section"><div class="label">Spielvorgaben</div><div class="players">${Array.from({length:S.count},(_,i)=>`<div class="playerRow"><div class="playerNo">${i+1}</div><input class="numInput" type="number" min="0" max="54" placeholder="Vorgabe ${i+1}" value="${S.stableHcp[i]||''}" oninput="S.stableHcp[${i}]=Math.max(0,Math.min(54,Number(this.value)||0));save();liveRefresh(this)"></div>`).join('')}</div></div>`;return `<div class="section"><div class="label">Spieler</div><div class="seg"><button class="${S.count===1?'active':''}" ${countFixed?'disabled':''} onclick="S.count=1;S.team=false;save();render()">1</button><button class="${S.count===2?'active':''}" onclick="S.count=2;S.team=false;save();render()">2</button><button class="${S.count===3?'active':''}" onclick="S.count=3;S.team=false;save();render()">3</button><button class="${S.count===4?'active':''}" onclick="S.count=4;if(S.mode==='match')S.team=true;save();render()">4</button></div></div><div class="section"><div class="label">Namen</div><div class="players">${Array.from({length:S.count},(_,i)=>`<div class="playerRow"><div class="playerNo">${i+1}</div><input class="textInput" placeholder="Spieler ${i+1}" value="${esc(S.players[i]||'')}" oninput="S.players[${i}]=this.value;save();liveRefresh(this)"></div>`).join('')}</div></div>${S.count===4&&teamAllowed?`<div class="section"><div class="label">Spielart</div><div class="seg two"><button class="${!S.team?'active':''}" onclick="S.team=false;save();render()">Einzel</button><button class="${S.team?'active':''}" onclick="S.team=true;save();render()">Team A / B</button></div></div>`:''}${S.mode==='match'&&S.count===4?`<div class="note">Bei 4 Spielern ist Matchplay ausschließlich Team A (1+2) gegen Team B (3+4).</div>`:''}${S.mode==='vegas'?`<div class="note">Team A = Spieler 1 + 2 · Team B = Spieler 3 + 4</div>`:''}${extra}`}
function header(){return `<div class="top"><button class="iconBtn" onclick="homeConfirm()">‹</button><div style="flex:1"><div class="title">${modeLabel()}</div><div class="hint">${S.count} Spieler${isTeam()?' · Team A vs Team B':''}</div></div><button class="iconBtn" onclick="scoreboard()">🏆</button><button class="iconBtn" onclick="resetConfirm()">↻</button></div>`}
function game(){let body=({count:countGame,match:matchGame,short:shortGame,fun:funGame,wolf:wolfGame,'531':game531,stable:stableGame,vegas:vegasGame,bbb:bbbGame,skins:skinsGame,nassau:nassauGame})[S.mode]();return `<div class="app">${header()}<div class="modeInfo"><span class="badge">${modeLabel()}</span>${isTeam()?'<span class="teamLabel">TEAM A · 1+2</span><span class="teamLabel">TEAM B · 3+4</span>':''}</div>${body}<div class="footerSpace"></div></div>`}
function scoreInputs(onChange,players=S.count){return Array.from({length:players},(_,i)=>`<input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${esc(onChange.val(i))}" oninput="${onChange.code(i,'this.value')}" />`).join('')}
function countGame(){let totals=Array(S.count).fill(0);for(let h=0;h<18;h++)for(let p=0;p<S.count;p++)totals[p]+=Number(getData(['count',h,p],0))||0;return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map((n,i)=>`<th>${esc(n)}${isTeam()?`<span class="sub">${i<2?'A':'B'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>`<tr class="${S.holeDone[h]?'animate':''}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:S.count},(_,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['count',h,p],'')}" oninput="setData(['count',${h},${p}],this.value);liveRefresh(this)" /></td>`).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td>${totals.map((t,p)=>`<td class="sum">${t||0}</td>`).join('')}</tr></tbody></table></div>${doneButtons()}`}
function toggleHole(h){S.holeDone[h]=!S.holeDone[h];save();render()}
function doneButtons(){return `<div class="section"><div class="label">Löcher</div><div class="miniGrid">${Array.from({length:18},(_,h)=>`<button class="smallBtn ${S.holeDone[h]?'active':''}" onclick="S.holeDone[${h}]=!S.holeDone[${h}];save();render()">${S.holeDone[h]?'✓ ':''}Loch ${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></button>`).join('')}</div></div>`}
function matchGame(){let pairs=isTeam()?[['Team A','Team B',0,2]]:[names().slice(0,2).map((x,i)=>x),];let aName=isTeam()?'Team A':playerName(0),bName=isTeam()?'Team B':playerName(1);let states=[0,0];for(let h=0;h<18;h++){let v=getData(['match',h],null);if(v===1)states[0]++;if(v===-1)states[1]++;}let diff=states[0]-states[1],remaining=18-Array.from({length:18},(_,h)=>getData(['match',h],0)).filter(Boolean).length;let status=matchStatus(diff,remaining);return `<div class="card"><div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="resultBox ${diff>0?'up':diff<0?'down':'tied'}">${esc(aName)} · ${status.a}</div><div class="resultBox ${diff<0?'up':diff>0?'down':'tied'}">${esc(bName)} · ${status.b}</div></div><table class="table"><thead><tr><th class="hole">Loch</th><th>${esc(aName)}</th><th>${esc(bName)}</th></tr></thead><tbody>${Array.from({length:18},(_,h)=>{let v=getData(['match',h],0);return `<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td><td><select class="compact" onchange="matchSet(${h},Number(this.value))"><option value="0" ${v===0?'selected':''}>Geteilt</option><option value="1" ${v===1?'selected':''}>Gewonnen</option><option value="-1" ${v===-1?'selected':''}>Verloren</option></select></td><td><select class="compact" disabled><option>${v===1?'Verloren':v===-1?'Gewonnen':'Geteilt'}</option></select></td></tr>`}).join('')}</tbody></table></div>`}
function matchStatus(d,r){if(Math.abs(d)>r)return d>0?{a:`Match ${d} & ${r}`,b:'Verloren'}:{a:'Verloren',b:`Match ${-d} & ${r}`};if(d===0)return {a:'Tied',b:'Tied'};return d>0?{a:`${d} & ${r}`,b:`${d} Down`}:{a:`${-d} Down`,b:`${-d} & ${r}`}}
function matchSet(h,v){S.data.match??={};S.data.match[h]=v;save();render()}
function shortClass(diff){if(diff===0)return 'circle par';if(diff===-1)return 'circle oneunder';if(diff<=-2)return 'circle twounder';if(diff===1)return 'sq oneover';return 'sq twoplus'}
function shortGame(){let totals=Array(S.count).fill(0);return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>`<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button><span class="sub">P${S.par}</span></td>${Array.from({length:S.count},(_,p)=>{let v=Number(getData(['short',h,p],''));if(v)totals[p]+=v;return `<td>${v?`<span class="${shortClass(v-S.par)}">${v}</span>`:''}<input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['short',h,p],'')}" oninput="setData(['short',${h},${p}],this.value);liveRefresh(this)"></td>`}).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t||0}</td>`).join('')}</tr></tbody></table></div>`}
function funGame(){ensureFunModes();let totals=Array(S.count).fill(0),resultPts=Array(S.count).fill(0),bonusPts=Array(S.count).fill(0);for(let h=0;h<18;h++){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['fun','results',h,p],'')));let pts=funPointsForHole(h);for(let p=0;p<S.count;p++){resultPts[p]+=pts[p];let bp=bonusFor(h,p);bonusPts[p]+=bp;totals[p]+=pts[p]+bp}}return `<div class="note" style="margin-bottom:9px">${isTeam()?'Teamwertung: Die Summe der Schläge von Team A wird gegen Team B gewertet; weniger Schläge gewinnt das Loch. Bonus/Malus bleiben individuell. ':'Pro Bahn: Ergebnis eintragen. Mit <b>+</b> vergibst du einen Bonus/Malus – jeder Ereignistyp darf in der Runde nur einmal aktiv sein.'}</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th><th>Modus</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>`<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button>${S.holeDone[h]?'<span class="sub">✓</span>':''}</td><td class="tiny">${esc(S.fun.holeModes[h])}<br>${S.fun.clubs[h]?`<span class="badge">${esc(S.fun.clubs[h])}</span>`:''}<button class="smallBtn" style="margin-top:4px" onclick="rerollFun(${h})">↻</button></td>${Array.from({length:S.count},(_,p)=>{let v=getData(['fun','results',h,p],'');let bp=bonusFor(h,p);return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${v}" oninput="funInput(${h},${p},this.value,this)"><div style="display:flex;justify-content:center;gap:4px;margin-top:4px"><span class="pill">${funPointsForHole(h)[p]??0}</span><button class="bonusBtn" onclick="bonusMenu(${h},${p})">+</button></div><div class="sub ${bp?'points':''}">${bp>=0?'+':''}${bp}</div>${shotClubDisplay(h,p)}</td>`}).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td><td></td>${Array.from({length:S.count},(_,p)=>`<td class="sum"><span>${totals[p]}</span><span class="sub">Ergebnis ${resultPts[p]} · Bonus ${bonusPts[p]}</span></td>`).join('')}</tr></tbody></table></div><div class="section"><button class="secondary" onclick="funGeneratorInfo()">🎲 Generator-Übersicht</button></div>`}
function ensureFunModes(){let pool=[...FUNMODES];for(let h=0;h<18;h++)if(!S.fun.holeModes[h]){if(S.fun.unique){let used=S.fun.holeModes.filter(Boolean);let available=pool.filter(x=>!used.includes(x));if(!available.length)available=pool;S.fun.holeModes[h]=available[Math.floor(Math.random()*available.length)]}else S.fun.holeModes[h]=pool[Math.floor(Math.random()*pool.length)];if(S.fun.holeModes[h].includes('Zufallsschläger')){if(S.fun.holeModes[h]==='Zufallsschläger für Alle (ganze Bahn)')S.fun.clubs[h]=CLUBS[Math.floor(Math.random()*CLUBS.length)];else if(S.fun.holeModes[h]==='Zufallsschläger (Luck of the draw)')S.fun.shotClubs[h]=Array.from({length:S.count},()=>[]);}save()}}
function rerollFun(h){let pool=FUNMODES.filter(x=>!S.fun.unique||!S.fun.holeModes.some((v,i)=>i!==h&&v===x));if(!pool.length)pool=FUNMODES;S.fun.holeModes[h]=pool[Math.floor(Math.random()*pool.length)];S.fun.clubs[h]=S.fun.holeModes[h]==='Zufallsschläger für Alle (ganze Bahn)'?CLUBS[Math.floor(Math.random()*CLUBS.length)]:null;save();render()}
function funInput(h,p,value,el){setData(['fun','results',h,p],value);let mode=S.fun.holeModes[h];if(mode==='Zufallsschläger (Luck of the draw)'){let n=Math.max(0,Math.min(30,Number(value)||0));S.fun.shotClubs[h][p]=S.fun.shotClubs[h][p]||[];while(S.fun.shotClubs[h][p].length<n)S.fun.shotClubs[h][p].push(CLUBS[Math.floor(Math.random()*CLUBS.length)]);if(S.fun.shotClubs[h][p].length>n)S.fun.shotClubs[h][p].length=n;save()}liveRefresh(el)}
function shotClubDisplay(h,p){let a=S.fun.shotClubs[h]?.[p]||[];if(!a.length)return '';return '<div class="sub" style="line-height:1.25;margin-top:3px">'+a.map((c,i)=>`${i+1}. ${esc(c)}`).join(' · ')+'</div>'}
function funPointsForHole(h){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['fun','results',h,p],'')));if(isTeam()){if(vals.some(v=>!v||v<=0))return Array(S.count).fill(0);let a=vals[0]+vals[1],b=vals[2]+vals[3],out=Array(4).fill(0);if(a<b){out[0]=out[1]=1;out[2]=out[3]=-1}else if(b<a){out[0]=out[1]=-1;out[2]=out[3]=1}return out}return funPoints(vals)}
function funPoints(vals){let idx=vals.map((v,i)=>({v,i})).filter(x=>Number.isFinite(x.v)&&x.v>0).sort((a,b)=>a.v-b.v);if(!idx.length)return Array(S.count).fill(0);let n=S.count, out=Array(n).fill(0);if(n===2){if(idx.length<2)return out;if(idx[0].v===idx[1].v)return out;out[idx[0].i]=1;out[idx[1].i]=-1;return out}let ranks=[];let groups=[];for(let i=0;i<idx.length;){let j=i;while(j<idx.length&&idx[j].v===idx[i].v)j++;groups.push(idx.slice(i,j));i=j}let valsPts=n===3?[1,0,-1]:[2,1,-1,-2];let pos=0;for(const g of groups){let rank=Math.min(pos,valsPts.length-1);let pv=valsPts[rank];g.forEach(x=>out[x.i]=pv);pos+=g.length}return out}
function bonusFor(h,p){return (S.fun.bonus[h]?.[p]||[]).reduce((a,b)=>a+b.v,0)}
function bonusMenu(h,p){let current=S.fun.bonus[h]?.[p]||[];let used=Array.from({length:18},(_,hh)=>S.fun.bonus[hh]||[]).flat().flat();showModal(`<h2>Bonus / Malus · Loch ${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></h2><p>${esc(playerName(p))} · Aktive Ereignisse zählen nur beim aktuellen Besitzer. Wird ein Ereignis später einem anderen Spieler gegeben, wird der alte Eintrag durchgestrichen.</p><div class="bonusList">${BONUS.map(([n,v],i)=>{let mine=current.find(x=>x.i===i);let other=used.find(x=>x.i===i&&!(h===x.h&&p===x.p));return `<div class="bonusItem ${other&&!mine?'used':''}"><div><b class="bonusName">${esc(n)}</b><br><em>${v>0?'+':''}${v}</em></div><button onclick="assignBonus(${h},${p},${i})">${mine?'✓':'+'}</button></div>`}).join('')}</div><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function assignBonus(h,p,i){S.fun.bonus=S.fun.bonus||Array.from({length:18},()=>Array.from({length:4},()=>[]));for(let hh=0;hh<18;hh++)for(let pp=0;pp<4;pp++)S.fun.bonus[hh][pp]=(S.fun.bonus[hh][pp]||[]).filter(x=>x.i!==i);S.fun.bonus[h][p].push({i,h,p,v:BONUS[i][1]});save();closeModal();render()}
function funGeneratorInfo(){showInfo('fun')}
function wolfGame(){let totals=Array(S.count).fill(0);let rows='';for(let h=0;h<18;h++){let wolf=h%S.count;let pick=getData(['wolf',h,'pick'],String((wolf+1)%S.count));let res=getData(['wolf',h,'result'],'geteilt');let pts=wolfPoints(S.count,wolf,pick,res);pts.forEach((x,p)=>totals[p]+=x);rows+=`<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button><span class="sub">${S.holeDone[h]?'✓':''}</span></td>${Array.from({length:S.count},(_,p)=>`<td class="${p===wolf?'teamHead':''}">${p===wolf?'<span class="badge">WOLF</span>':''}</td>`).join('')}</tr><tr><td class="hole">↳</td><td colspan="${S.count}"><div class="miniGrid"><select class="select" onchange="setData(['wolf',${h},'pick'],this.value);save();updateScorebar()">${Array.from({length:S.count},(_,p)=>p===wolf?'':`<option value="${p}" ${String(pick)===String(p)?'selected':''}>${esc(playerName(p))}</option>`).join('')}<option value="lone" ${pick==='lone'?'selected':''}>Lone Wolf</option></select><select class="select" onchange="setData(['wolf',${h},'result'],this.value);save();updateScorebar()">${pick==='lone'?'<option>lone gewonnen</option><option>lone verloren</option><option>geteilt</option>':'<option>Wolf gewonnen</option><option>Wolf verloren</option><option>geteilt</option>'}</select></div><div class="sub" style="margin-top:4px">Punkte: ${pts.map((x,p)=>`${esc(playerName(p))} ${x}`).join(' · ')}</div></td></tr>`}return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}
function wolfPoints(n,w,pick,res){let a=Array(n).fill(0);if(res==='geteilt')return a;if(pick==='lone'){if(res==='lone gewonnen'){a[w]=3}else if(res==='lone verloren')for(let p=0;p<n;p++)if(p!==w)a[p]=1;return a}let q=Number(pick);if(res==='Wolf gewonnen'){a[w]=1;a[q]=1}else if(res==='Wolf verloren')for(let p=0;p<n;p++)if(p!==w&&p!==q)a[p]=1;return a}
function game531(){let totals=[0,0,0];return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>{let vals=Array.from({length:3},(_,p)=>Number(getData(['531',h,p],'')));let pts=pts531(vals);pts.forEach((x,p)=>totals[p]+=x);return `<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:3},(_,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['531',h,p],'')}" oninput="setData(['531',${h},${p}],this.value);liveRefresh(this)"><div class="sub rankPts">${pts[p]}</div></td>`).join('')}</tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}
function pts531(vals){if(vals.some(v=>!v||v<=0))return [0,0,0];let a=vals.map((v,i)=>({v,i})).sort((x,y)=>x.v-y.v);if(a[0].v===a[2].v)return [3,3,3];if(a[0].v===a[1].v)return a.map(x=>x.v===a[0].v?4:1);if(a[1].v===a[2].v)return a.map(x=>x.v===a[2].v?2:5);return a.map(x=>x.i===a[0].i?5:x.i===a[1].i?3:1)}
function stableGame(){let totals=Array(S.count).fill(0);let hcp=holeHandicap();return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th><th>PAR</th><th>HCP</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>{let par=S.settings[h][1],hcpv=S.settings[h][2];return `<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td><td>${par}</td><td>${hcpv}</td>${Array.from({length:S.count},(_,p)=>{let gross=Number(getData(['stable',h,p],''));let alloc=hcp[p];let net=alloc===undefined?null:gross?gross-alloc:null;let pts=gross?Math.max(0,2+(par+alloc-gross)):0;if(gross)totals[p]+=pts;return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['stable',h,p],'')}" oninput="setData(['stable',${h},${p}],this.value);liveRefresh(this)"><span class="hcptxt">${alloc>=0?alloc:0}</span>${gross?`<span class="stablePts">${pts}</span>`:''}</td>`}).join('')}</tr>`}).join('')}<tr><td class="sum">Σ</td><td></td><td></td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="note" style="margin-top:9px">Vorgaben werden ab HCP 1 lochweise verteilt. Bei mehr als 18 beginnt die Verteilung erneut bei HCP 1.</div>`}
function holeHandicap(){let out=Array.from({length:S.count},()=>Array(18).fill(0));for(let p=0;p<S.count;p++){let strokes=Number(S.stableHcp[p])||0;for(let i=0;i<18;i++)out[p][i]=Math.floor(strokes/18)+(S.settings[i][2]<=strokes%18?1:0)}return out.map(a=>a)}
function vegasGame(){let totals=[0,0];return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map((n,i)=>`<th class="teamHead">${esc(n)}<span class="sub">Team ${i<2?'A':'B'}</span></th>`).join('')}<th>Teams</th></tr></thead><tbody>${Array.from({length:18},(_,h)=>{let vals=Array.from({length:4},(_,p)=>Number(getData(['vegas',h,p],'')));let a=vals.slice(0,2).every(Boolean)?`${Math.min(vals[0],vals[1])}${Math.max(vals[0],vals[1])}`:'';let b=vals.slice(2,4).every(Boolean)?`${Math.min(vals[2],vals[3])}${Math.max(vals[2],vals[3])}`:'';let birdA=getData(['vegas',h,'birdA'],false),birdB=getData(['vegas',h,'birdB'],false);let shownA=a,shownB=b;if(birdB&&a)shownA=`${a[1]}${a[0]}`;if(birdA&&b)shownB=`${b[1]}${b[0]}`;if(a)totals[0]+=Number(shownA);if(b)totals[1]+=Number(shownB);return `<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${vals.map((v,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['vegas',h,p],'')}" oninput="setData(['vegas',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}<td><div class="pill">A ${shownA||'—'}</div><div class="pill">B ${shownB||'—'}</div><label class="sub" style="display:block;margin-top:5px;text-align:left"><input type="checkbox" ${birdA?'checked':''} onchange="setData(['vegas',${h},'birdA'],this.checked);render()"> Birdie Team A</label><label class="sub" style="display:block;margin-top:3px;text-align:left"><input type="checkbox" ${birdB?'checked':''} onchange="setData(['vegas',${h},'birdB'],this.checked);render()"> Birdie Team B</label></td></tr>`}).join('')}<tr><td class="sum">Σ</td><td colspan="2" class="sum">Team A ${totals[0]}</td><td colspan="2" class="sum">Team B ${totals[1]}</td><td></td></tr></tbody></table></div>`}
function bbbGame(){let totals=Array(S.count).fill(0);return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>{let awards=['bingo','bango','bongo'];return `<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:S.count},(_,p)=>{let pts=awards.reduce((a,k)=>a+(getData(['bbb',h,k],-1)==p?1:0),0);totals[p]+=pts;return `<td class="points">${pts}</td>`}).join('')}</tr><tr><td class="hole">↳</td><td colspan="${S.count}">${awards.map((k,i)=>`<label class="sub" style="display:block;text-align:left;margin:4px 0">${['Bingo – erster auf dem Grün','Bango – nearest to the pin (alle auf Grün)','Bongo – erster im Loch'][i]} <select class="select" onchange="setData(['bbb',${h},'${k}'],Number(this.value));save();updateScorebar()"><option value="-1">—</option>${names().map((n,p)=>`<option value="${p}" ${getData(['bbb',h,k],-1)==p?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`).join('')}</td></tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}
function skinsGame(){let totals=Array(S.count).fill(0);let carry=1;let rows='';for(let h=0;h<18;h++){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['skins',h,p],'')));let complete=vals.every(v=>v>0);let best=complete?Math.min(...vals):null;let winners=complete?vals.map((v,p)=>v===best?p:null).filter(p=>p!==null):[];let pts=winners.length===1?carry:0;if(winners.length===1){totals[winners[0]]+=pts;carry=1}else carry++;rows+=`<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${vals.map((v,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['skins',h,p],'')}" oninput="setData(['skins',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`}return `<div class="note">Ein Skin geht an den alleinigen Lochgewinner. Bei Gleichstand wandert er weiter; der nächste alleinige Gewinner erhält die aufgelaufenen Skins. Aktueller Carry: <b>${carry}</b>.</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}
function nassauGame(){let totals=Array(S.count).fill(0);let front=Array(S.count).fill(0),back=Array(S.count).fill(0),all=Array(S.count).fill(0);for(let h=0;h<18;h++){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['nassau',h,p],'')));for(let p=0;p<S.count;p++){if(vals[p]>0){all[p]+=vals[p];if(h<9)front[p]+=vals[p];else back[p]+=vals[p]}}}return `<div class="note">Nassau wird als drei Schlagzahl-Wertungen geführt: Front 9, Back 9 und Gesamt 18. Bei Gleichstand gibt es keinen alleinigen Sieger.</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>`<tr><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:S.count},(_,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['nassau',h,p],'')}" oninput="setData(['nassau',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td>${all.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="miniGrid" style="margin-top:9px">${names().map((n,p)=>`<div class="settingCard"><b>${esc(n)}</b><div class="sub">Front 9 · ${front[p]}</div><div class="sub">Back 9 · ${back[p]}</div><div class="points">Gesamt · ${all[p]}</div></div>`).join('')}</div>`}
function scoreboard(){let arr;if(isTeam()){let sums=[0,0];if(S.mode==='count'){for(let p=0;p<2;p++)for(let h=0;h<18;h++)sums[0]+=Number(getData(['count',h,p],0))||0;for(let p=2;p<4;p++)for(let h=0;h<18;h++)sums[1]+=Number(getData(['count',h,p],0))||0}else if(S.mode==='fun'){for(let p=0;p<2;p++)sums[0]+=scoreFor(p);for(let p=2;p<4;p++)sums[1]+=scoreFor(p)}arr=[['Team A',sums[0]],['Team B',sums[1]]]}else{arr=names().map((n,p)=>[n,scoreFor(p)]).sort((a,b)=>b[1]-a[1])}showModal(`<h2>🏆 Scoreboard</h2><p>Aktueller Überblick · ${modeLabel()}</p>${arr.map((x,i)=>`<div class="settingCard" style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b>${i+1}. ${esc(x[0])}</b><span class="points">${x[1]}</span></div>`).join('')}<div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function scoreFor(p){if(S.mode==='count')return Array.from({length:18},(_,h)=>Number(getData(['count',h,p],0))||0).reduce((a,b)=>a+b,0);if(S.mode==='fun')return Array.from({length:18},(_,h)=>funPointsForHole(h)[p]+bonusFor(h,p)).reduce((a,b)=>a+b,0);if(S.mode==='stable')return stableTotal(p);if(S.mode==='bbb')return Array.from({length:18},(_,h)=>['bingo','bango','bongo'].reduce((a,k)=>a+(getData(['bbb',h,k],-1)==p?1:0),0)).reduce((a,b)=>a+b,0);if(S.mode==='wolf')return Array.from({length:18},(_,h)=>wolfPoints(S.count,h%S.count,getData(['wolf',h,'pick'],''),getData(['wolf',h,'result'],'geteilt'))[p]).reduce((a,b)=>a+b,0);if(S.mode==='531')return Array.from({length:18},(_,h)=>pts531(Array.from({length:3},(_,q)=>Number(getData(['531',h,q],''))))[p]).reduce((a,b)=>a+b,0);return 0}
function stableTotal(p){let h=holeHandicap()[p],t=0;for(let i=0;i<18;i++){let g=Number(getData(['stable',i,p],''));if(g)t+=Math.max(0,2+(S.settings[i][1]+h[i]-g))}return t}
function showInfo(m){showModal(`<h2>${esc(MODES.find(x=>x[0]===m)?.[1]||'Regeln')}</h2><p>${esc(MODEINFO[m]||'')}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox animate">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function resetConfirm(){showModal(`<h2>Spiel zurücksetzen?</h2><p>Alle Eintragungen dieses Spiels werden gelöscht. Die Platzdaten bleiben erhalten.</p><div class="modalActions"><button class="close" onclick="closeModal()">Abbrechen</button><button class="close danger" onclick="resetGame()">Alles löschen</button></div>`)}function resetGame(){let keep={settings:S.settings,players:S.players,count:S.count,team:S.team,mode:S.mode,par:S.par,stableHcp:S.stableHcp};S=blankState();S.settings=keep.settings;S.players=keep.players;S.count=keep.count;S.team=keep.team;S.mode=keep.mode;S.par=keep.par;S.stableHcp=keep.stableHcp;save();closeModal();render()}
function homeConfirm(){showModal(`<h2>Zur Startseite?</h2><p>Der aktuelle Spielstand bleibt gespeichert. Du kannst später weiterspielen.</p><div class="modalActions"><button class="close" onclick="closeModal()">Bleiben</button><button class="close danger" onclick="S.screen='home';save();closeModal();render()">Zur Startseite</button></div>`)}
function courseSettings(){showModal(`<h2>⚙ Platzdaten</h2><p>Voreinstellung: Golfclub Varus. Ändere PAR und HCP nur bei Bedarf.</p><div class="settingsGrid">${S.settings.map((r,i)=>`<div class="settingCard"><label>Loch ${i+1}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input class="numInput" type="number" min="1" max="9" value="${r[1]}" onchange="S.settings[${i}][1]=Math.max(1,Math.min(9,Number(this.value)||4));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"><input class="numInput" type="number" min="1" max="18" value="${r[2]}" onchange="S.settings[${i}][2]=Math.max(1,Math.min(18,Number(this.value)||1));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"></div></div>`).join('')}</div><div class="modalActions"><button class="close" onclick="closeModal();save();render()">Speichern</button><button class="close danger" onclick="restoreCourse()">Varus zurücksetzen</button></div>`)}function restoreCourse(){S.settings=HOLES.map(x=>[...x]);localStorage.setItem('gd_course',JSON.stringify(S.settings));save();courseSettings()}
function startGame(){if(!S.mode){showModal('<h2>Modus auswählen</h2><p>Bitte wähle zuerst einen Spielmodus.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>');return}let n=S.count;let err='';if(S.mode==='531'&&n!==3)err='5–3–1 benötigt genau 3 Spieler.';if(S.mode==='vegas'&&n!==4)err='Las Vegas benötigt genau 4 Spieler.';if(S.mode==='wolf'&&n<3)err='Wolf benötigt 3 oder 4 Spieler.';if(S.mode==='bbb'&&n<2)err='Bingo Bango Bongo benötigt mindestens 2 Spieler.';if(S.mode==='skins'&&n<2)err='Skins benötigt mindestens 2 Spieler.';if(S.mode==='nassau'&&n<2)err='Nassau benötigt mindestens 2 Spieler.';if(S.mode==='fun'&&n<2)err='Fun benötigt mindestens 2 Spieler.';if(S.mode==='match'&&![2,4].includes(n))err='Matchplay benötigt 2 oder 4 Spieler.';if(S.mode==='match'&&n===4)S.team=true;if(err){showModal(`<h2>Spieleranzahl</h2><p>${esc(err)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return}S.players=Array.from({length:n},(_,i)=>S.players[i]?.trim()||`Spieler ${i+1}`);S.screen='game';save();render()}
// Make scorebar from mode totals, kept intentionally compact.
function liveRefresh(el){const inputs=[...document.querySelectorAll('input')];const idx=inputs.indexOf(el);const st=typeof el.selectionStart==='number'?el.selectionStart:null,en=typeof el.selectionEnd==='number'?el.selectionEnd:null;render();const next=[...document.querySelectorAll('input')][idx];if(next){next.focus();if(st!==null&&next.setSelectionRange){try{next.setSelectionRange(st,en)}catch(e){}}}}
function updateScorebar(){let el=document.getElementById('scorebar');if(el)el.remove();if(S.screen!=='game')return;let vals=isTeam()?[['Team A',scoreFor(0)+scoreFor(1)],['Team B',scoreFor(2)+scoreFor(3)]]:names().map((n,p)=>[n,scoreFor(p)]);let bar=document.createElement('div');bar.id='scorebar';bar.className='scorebar';bar.innerHTML=vals.map(x=>`<div class="scorechip"><b>${esc(x[1])}</b><small>${esc(x[0])}</small></div>`).join('');document.body.appendChild(bar)}
render();
</script></body></html>
